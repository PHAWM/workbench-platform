services:

  api:
    build: 
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ../:/app
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STORAGE_BACKEND= ${STORAGE_BACKEND}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
    networks:
      - backend-network

  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - backend-network

  pgadmin:
     image: dpage/pgadmin4:9.4
     container_name: pgadmin
     restart: unless-stopped
     environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
     ports:
       - "5050:80"
     volumes:
       - pgadmin_data:/var/lib/pgadmin
     networks:
       - backend-network

  # S3-compatible storage (RustFS) for local development
  rustfs:
    image: rustfs/rustfs:latest   # your RustFS image
    container_name: rustfs-storage
    command: server /data --console-address ":9001"
    environment:
      - RUSTFS_ROOT_USER=${S3_ACCESS_KEY:-admin}
      - RUSTFS_ROOT_PASSWORD=${S3_SECRET_KEY:-admin}  
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO console
    volumes:
      - rustfs-data:/data
    restart: unless-stopped
    networks:
      - backend-network
      
  prestart:
    image: python:3.12-slim
    container_name: prestart
    volumes:
      - ../:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    command:
        - bash
        - -c
        - |
         pip install -r requirements.txt &&
         bash scripts/prestart.sh
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - backend-network

volumes:
  pgadmin_data:

networks:
  backend-network:
    name: backend-network
