services:
  app:
    image: node:22.22.0-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install --force && npm start -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    networks:
      - backend-network


networks:
  backend-network:
    name: backend-network
