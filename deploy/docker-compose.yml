services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - platform-network
    depends_on:
      - api
      - docs

  api:
    build: 
      context: ../backend
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STORAGE_BACKEND=${STORAGE_BACKEND}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - platform-network
  
  postgres-mt:
    image: postgres:15
    container_name: postgres-db-mt
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5433:5432"                          # 5433 to avoid clash with single-tenant on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - postgres-mt-data:/var/lib/postgresql/data
    networks:
      - platform-network

  rustfs-mt:
    image: rustfs/rustfs:latest
    container_name: rustfs-mt
    command: server /data --console-address ":9001"
    environment:
      - RUSTFS_ROOT_USER=${S3_ACCESS_KEY:-admin}
      - RUSTFS_ROOT_PASSWORD=${S3_SECRET_KEY:-admin}
    ports:
      - "9002:9000"                          # 9002 to avoid clash with single-tenant on 9000
      - "9003:9001"                          # 9003 console
    volumes:
      - rustfs-mt-data:/data
    restart: unless-stopped
    networks:
      - platform-network

  prestart:
    build:
      context: ../backend
      dockerfile: deploy/Dockerfile
    container_name: prestart-mt
    working_dir: /app
    depends_on:
      postgres-mt:
        condition: service_healthy
      rustfs-mt:
        condition: service_started
    command:
      - bash
      - -c
      - |
        set -e
        pip install psycopg2-binary --quiet
        python scripts/create_db_if_not_exists.py
        alembic upgrade head
        python scripts/clean_public_schema.py
        python scripts/migrations/init_default_tenant.py
    environment:
      - PYTHONPATH=/app
      - ENV_FILE=deploy/.env
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres-db-mt
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - S3_ENDPOINT_URL=http://rustfs-mt:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-admin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-workbench}
      - S3_REGION=${S3_REGION:-us-east-1}
      - STORAGE_BACKEND=s3
    networks:
      - platform-network
    restart: "no"

  docs:
    image: squidfunk/mkdocs-material:9
    volumes:
      - ../docs:/docs
    ports:
      - "8001:8000"
    working_dir: /docs
    command: serve -a 0.0.0.0:8000 
    networks:
      - platform-network
    restart: unless-stopped

  sam-api:
    build:
      context: ../backend
      dockerfile: src/services/model_service/api/SAM/Dockerfile
    container_name: sam-attachment-monitor
    environment:
      - PYTHONPATH=/app
      - S3_ENDPOINT_URL=http://rustfs-mt:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-admin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-workbench}
      - S3_REGION=${S3_REGION:-us-east-1}
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - platform-network
 
  universal-llm-api:
    build:
      context: ../backend
      dockerfile: src/services/model_service/api/Universal/Dockerfile
    container_name: universal-llm-inference
    environment:
      - PYTHONPATH=/app
      # API keys are provided per-request, not as env vars
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - platform-network

  annif-api:
    build:
      context: ../backend
      dockerfile: src/services/model_service/api/ANNIF/Dockerfile
    container_name: annif-subject-indexing
    environment:
      - PYTHONPATH=/app
    ports:
      - "8004:8004"
    restart: unless-stopped
    networks:
      - platform-network

  pyterrier-rag-api:
    build:
      context: ../backend
      dockerfile: src/services/model_service/api/PyTerrier/Dockerfile
    container_name: pyterrier-rag
    environment:
      - PYTHONPATH=/app
      - S3_ENDPOINT_URL=http://rustfs-mt:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-admin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-workbench}
      - S3_REGION=${S3_REGION:-us-east-1}
      - LLM_MCP_URL=http://universal-llm-inference:8003
      - PYTERRIER_INDEX_DIR=/data/indexes
    ports:
      - "8006:8006"
    volumes:
      - pyterrier-indexes:/data/indexes
    restart: unless-stopped
    networks:
      - platform-network

  phawm-sam-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_TENANT_ID=phawm_sam
        - VITE_IS_DEMO=true
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - VITE_DOCS_URL=${VITE_DOCS_URL}
      - VITE_API_URL=${VITE_API_URL}
      - VITE_IS_DEMO=true
      - VITE_TENANT_ID=phawm_sam
    networks:
      - platform-network
    restart: unless-stopped

  phawm-annif-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_TENANT_ID=phawm_annif
        - VITE_IS_DEMO=false
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
      - VITE_DOCS_URL=${VITE_DOCS_URL}
      - VITE_API_URL=${VITE_API_URL}
      - VITE_IS_DEMO=false
      - VITE_TENANT_ID=phawm_annif
    networks:
      - platform-network
    restart: unless-stopped

  demo-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_TENANT_ID=demo
        - VITE_IS_DEMO=true
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=production
      - VITE_DOCS_URL=${VITE_DOCS_URL}
      - VITE_API_URL=${VITE_API_URL}
      - VITE_IS_DEMO=true
      - VITE_TENANT_ID=demo
    networks:
      - platform-network
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  rustfs-mt-data:
    driver: local
  pyterrier-indexes:
    driver: local
  postgres-mt-data:
    driver: local

networks:
  platform-network:
    name: platform-network
